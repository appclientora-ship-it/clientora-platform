name: Quality checks

on:
  push:
    branches:
      - fix/booking-integrity-phase-1
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build
