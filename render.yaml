services:
  - type: web
    name: clientora-platform
    runtime: node
    plan: free
    buildCommand: npm install --global pnpm@10.18.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
