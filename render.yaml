services:
  - type: web
    name: clientora-platform
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MANUS_OAUTH_API_URL
        value: https://api.manus.ai
